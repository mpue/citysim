server {
    listen 80;
    server_name citysim.deinedomain.de www.citysim.deinedomain.de;

    # Optional: HTTP zu HTTPS umleiten (wenn SSL eingerichtet)
    # return 301 https://$server_name$request_uri;

    # Access und Error Logs
    access_log /var/log/nginx/citysim_access.log;
    error_log /var/log/nginx/citysim_error.log;

    # Client Body Size (für File Uploads erhöhen falls nötig)
    client_max_body_size 10M;

    # Proxy zur Node.js App
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Files Caching (CSS, JS, Images, Fonts)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|mp3|wav)$ {
        proxy_pass http://localhost:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sicherheits-Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

