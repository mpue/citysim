version: '3.8'

services:
  citysim-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citysim-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    volumes:
      # Optional: Mount für Entwicklung
      # - ./server:/app/server
      # - ./dist:/app/dist
      # - ./icons:/app/icons
      # - ./fx:/app/fx
      # - ./songs:/app/songs
      - /app/server/node_modules
    networks:
      - citysim-network

networks:
  citysim-network:
    driver: bridge
